<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is a page to learn Forms & Inputs in HTML">
    <title>Forms & Inputs - Lets learn it
    </title>
</head>

<body>
    <h1>Form to apply for Programmers</h1>
    <form action="post">
        <!-- Username -->
        <div>
            <label for="username">Username: </label>
            <input type="text" name="username" id="username" placeholder="Enter your username" autofocus>
        </div>

        <!-- Gender -->
        <div>
            <label for="male">Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </div>

        <!-- Subscribe -->
        <div>
            <input type="checkbox" id="subscribe" name="subscribe" value="yes" checked>
            <label for="subscribe">Subsribe to newsletter</label>
        </div>

        <!-- Textarea Tag -->
         <div>
            <label for="comment">Enter your Comment: </label>
            <br>
            <textarea name="comment" placeholder="" rows="4" cols="50" id="comment"></textarea>
         </div>

         <!-- Select Tag -->
          <div>
            <select name="fruits" id="fruits">
                <option value="apple">Apple</option>
                <option value="mango">Mango</option>
                <option value="cherry">Cherry</option>
            </select>
          </div>
    </form>
</body>

</html>
